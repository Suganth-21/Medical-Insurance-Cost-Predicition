<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Stethoscope Flexible Tube -->
    <path d="M 50 25 A 32 32 0 1 1 18 57" fill="none" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Chest Piece -->
    <circle cx="18" cy="57" r="7" fill="#1E293B" />
    <circle cx="18" cy="57" r="3.5" fill="#F0FDFA" />
    <circle cx="18" cy="57" r="1.5" fill="#0D9488" />

    <!-- Stethoscope Headset (Metal) -->
    <path d="M 40 10 C 42 20, 48 25, 50 25" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />
    <path d="M 60 10 C 58 20, 52 25, 50 25" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />

    <!-- Ear Tips -->
    <circle cx="39" cy="9" r="3.5" fill="#1E293B" />
    <circle cx="61" cy="9" r="3.5" fill="#1E293B" />

    <!-- Medical Paper -->
    <rect x="32" y="32" width="36" height="46" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
    
    <!-- Paper Header Line -->
    <line x1="39" y1="42" x2="61" y2="42" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Paper Text Lines -->
    <line x1="39" y1="50" x2="55" y2="50" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="39" y1="57" x2="61" y2="57" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="39" y1="64" x2="50" y2="64" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

    <!-- Medical Cross -->
    <path d="M 55 69 h 3 v -3 h 2 v 3 h 3 v 2 h -3 v 3 h -2 v -3 h -3 z" fill="#0D9488" />
</svg>
